<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BINNA — Create Account</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d0f14;--surface:#141720;--surface2:#1c2030;
  --border:#252a3a;--border2:#2e3550;
  --accent:#e8a030;--accent2:#f0b84a;
  --text:#eef0f6;--muted:#7a8099;--muted2:#5a6180;
  --danger:#e85050;--success:#3a9e6a;
  --radius:10px;
}
body{
  background:var(--bg);color:var(--text);
  font-family:'DM Sans',sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
}
body::before{
  content:'';position:fixed;inset:0;
  background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:40px 40px;opacity:.3;pointer-events:none;
}
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:18px;
  padding:44px 40px;width:100%;max-width:440px;position:relative;
  box-shadow:0 32px 80px rgba(0,0,0,.6);
}
.logo{font-family:'Syne',sans-serif;font-size:34px;font-weight:800;color:var(--accent);letter-spacing:-1px;line-height:1}
.logo-sub{font-size:12px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-top:4px;margin-bottom:36px}
.heading{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;color:var(--text);margin-bottom:6px}
.heading-sub{font-size:13px;color:var(--muted);margin-bottom:24px}
.form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.form-label{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}
.form-hint{font-size:11px;color:var(--muted2);margin-top:2px}
.form-input{
  background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);
  padding:12px 14px;font-size:14px;color:var(--text);font-family:'DM Sans',sans-serif;
  transition:border-color .15s,background .15s;width:100%;
}
.form-input:focus{outline:none;border-color:var(--accent);background:#1c1600}
.form-input::placeholder{color:var(--muted2)}
.form-input.error{border-color:var(--danger)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:13px 20px;border-radius:var(--radius);font-size:14px;font-weight:500;
  cursor:pointer;border:none;font-family:'DM Sans',sans-serif;transition:all .15s;width:100%;
}
.btn-primary{background:var(--accent);color:#000;font-weight:600}
.btn-primary:hover{background:var(--accent2);transform:translateY(-1px)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.alert{
  padding:11px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;
  display:none;line-height:1.4;
}
.alert-error{background:#2a1010;border:1px solid #e8505044;color:#f08080}
.alert-success{background:#0f2a1e;border:1px solid #3a9e6a44;color:#7adaa0}
.footer-link{text-align:center;margin-top:28px;font-size:13px;color:var(--muted)}
.footer-link a{color:var(--accent);text-decoration:none;font-weight:500}
.footer-link a:hover{text-decoration:underline}
/* password strength bar */
.pw-bar{height:3px;border-radius:2px;margin-top:5px;background:var(--border);transition:all .3s}
.pw-bar-fill{height:100%;border-radius:2px;transition:all .3s;width:0}
</style>
</head>
<body>

<div class="card">
  <div class="logo">BINNA</div>
  <div class="logo-sub">Construction Project Management</div>

  <div class="heading">Create your account</div>
  <div class="heading-sub">The first account registered becomes the system admin.</div>

  <div class="alert alert-error"   id="alert-error"></div>
  <div class="alert alert-success" id="alert-success"></div>

  <form id="register-form" onsubmit="handleRegister(event)">
    <div class="form-group">
      <label class="form-label">Username</label>
      <input class="form-input" type="text" id="username"
             placeholder="e.g. ahmed_ali" required autocomplete="username"
             oninput="clearError(this)" />
      <div class="form-hint">At least 3 characters. Used to log in and mention in reports.</div>
    </div>

    <div class="form-group">
      <label class="form-label">Email Address</label>
      <input class="form-input" type="email" id="email"
             placeholder="you@company.com" required autocomplete="email"
             oninput="clearError(this)" />
    </div>

    <div class="form-group">
      <label class="form-label">Password</label>
      <input class="form-input" type="password" id="password"
             placeholder="At least 6 characters" required autocomplete="new-password"
             oninput="onPasswordInput(this)" />
      <div class="pw-bar"><div class="pw-bar-fill" id="pw-bar-fill"></div></div>
    </div>

    <div class="form-group" style="margin-bottom:22px">
      <label class="form-label">Confirm Password</label>
      <input class="form-input" type="password" id="confirm-password"
             placeholder="Repeat password" required autocomplete="new-password"
             oninput="clearError(this)" />
    </div>

    <button class="btn btn-primary" type="submit" id="btn-submit">
      Create Account &rarr;
    </button>
  </form>

  <div class="footer-link">
    Already have an account? <a href="/login">Sign in</a>
  </div>
</div>

<script>
if (localStorage.getItem('binna_token')) window.location.href = '/dashboard';

async function handleRegister(e) {
  e.preventDefault();
  clearAlerts();

  const username  = document.getElementById('username').value.trim();
  const email     = document.getElementById('email').value.trim();
  const password  = document.getElementById('password').value;
  const confirm   = document.getElementById('confirm-password').value;
  const btn       = document.getElementById('btn-submit');

  if (username.length < 3)      { markError('username', 'Username must be at least 3 characters'); return; }
  if (password.length < 6)      { markError('password', 'Password must be at least 6 characters'); return; }
  if (password !== confirm)     { markError('confirm-password', 'Passwords do not match'); return; }

  btn.disabled    = true;
  btn.textContent = 'Creating account…';

  try {
    const res = await fetch('/api/v1/auth/register', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ username, email, password }),
    });
    const data = await res.json();

    if (!res.ok) { showError(data.error || 'Registration failed'); return; }

    localStorage.setItem('binna_token', data.access_token);
    localStorage.setItem('binna_user',  JSON.stringify(data.user));

    showSuccess('✓ Account created! Redirecting to your dashboard…');
    setTimeout(() => window.location.href = '/dashboard', 900);

  } catch (err) {
    showError('Network error — is the BINNA server running?');
  } finally {
    btn.disabled    = false;
    btn.textContent = 'Create Account →';
  }
}

function onPasswordInput(el) {
  const len  = el.value.length;
  const fill = document.getElementById('pw-bar-fill');
  const pct  = Math.min(100, (len / 12) * 100);
  fill.style.width = pct + '%';
  fill.style.background = len < 6 ? '#e85050' : len < 10 ? '#e8a030' : '#3a9e6a';
}

function markError(fieldId, msg) {
  const el = document.getElementById(fieldId);
  el.classList.add('error');
  showError(msg);
  el.focus();
}
function clearError(el) { el.classList.remove('error'); }
function showError(msg)   { const e = document.getElementById('alert-error');   e.textContent = msg; e.style.display = 'block'; }
function showSuccess(msg) { const e = document.getElementById('alert-success'); e.textContent = msg; e.style.display = 'block'; }
function clearAlerts()    { document.getElementById('alert-error').style.display = 'none'; document.getElementById('alert-success').style.display = 'none'; }
</script>
</body>
</html>
