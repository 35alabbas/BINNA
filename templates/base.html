<!DOCTYPE html>
<html lang="en" data-theme="">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/static/js/theme.js"></script>
<link rel="stylesheet" href="/static/css/theme.css">
<title>{% block title %}BINNA{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* ── Shared top navigation (Obsidian Crown) ─────────────────────────────────
   Default nav used by dashboard; pages may override the topbar block.
   Page-level extra_css is injected AFTER this block, so a page can
   override these rules for its own bespoke topbar. ──────────────────────────── */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;height:56px;background:var(--bg-deep);
  border-bottom:1px solid var(--border-gold);position:sticky;top:0;z-index:100;
}
.topbar .logo{font-family:'Syne',sans-serif;font-weight:900;font-size:20px;color:var(--gold);letter-spacing:.02em}
.topbar .logo-sub{color:var(--text-muted);font-weight:400;font-size:12px;margin-left:10px}
.topbar-right{display:flex;align-items:center;gap:10px}
.user-pill{
  display:flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;
  border:1px solid var(--border-gold);border-radius:20px;background:var(--gold-dim);
  cursor:pointer;color:var(--gold);transition:background .12s;
}
.user-pill:hover{background:rgba(197,168,90,0.14)}
.user-pill .avatar{
  width:28px;height:28px;border-radius:50%;background:var(--purple);
  color:#fff;font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.user-pill .user-name{font-size:13px;font-weight:500;color:var(--text-mid)}
.nav-logout{
  display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:7px;
  font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border-gold);
  background:var(--gold-dim);color:var(--gold);font-family:inherit;transition:background .12s;
}
.nav-logout:hover{background:rgba(197,168,90,0.14)}
</style>

{% block extra_css %}{% endblock %}
<link rel="stylesheet" href="/static/css/management.css">
</head>
<body>

{% if not hide_nav %}
{% block topbar %}
<div class="topbar">
  <div style="display:flex;align-items:center">
    <a href="/dashboard" style="text-decoration:none"><span class="logo">BINNA</span></a>
    <span class="logo-sub">Construction PM</span>
  </div>
  <div class="topbar-right">
    <button class="mgmt-language-toggle" type="button" onclick="BINNA_I18N.toggle()">العربية</button>
    <div class="user-pill" id="user-pill">
      <div class="avatar" id="user-avatar">?</div>
      <span class="user-name" id="user-name">Loading…</span>
    </div>
    <button class="nav-logout" onclick="BINNA.logout()">Log Out</button>
  </div>
</div>
{% endblock %}
{% endif %}

{% if not hide_nav %}
<aside class="mgmt-sidebar" aria-label="Management navigation">
  <a href="/dashboard" data-i18n="dashboard">Dashboard</a>
  <a href="/company" data-i18n="company">Company</a>
  <a href="/dashboard" data-i18n="project">Project</a>
</aside>
{% endif %}

{% block content %}{% endblock %}

{% block footer %}{% endblock %}

<script src="/static/js/binna-api.js"></script>
<script src="/static/js/management-i18n.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
