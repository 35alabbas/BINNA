<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BINNA — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d0f14;--surface:#141720;--surface2:#1c2030;
  --border:#252a3a;--border2:#2e3550;
  --accent:#e8a030;--accent2:#f0b84a;
  --text:#eef0f6;--muted:#7a8099;--muted2:#5a6180;
  --danger:#e85050;--success:#3a9e6a;
  --radius:10px;
}
body{
  background:var(--bg);color:var(--text);
  font-family:'DM Sans',sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
}
/* subtle grid background */
body::before{
  content:'';position:fixed;inset:0;
  background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:40px 40px;opacity:.3;pointer-events:none;
}
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:18px;
  padding:44px 40px;width:100%;max-width:420px;position:relative;
  box-shadow:0 32px 80px rgba(0,0,0,.6);
}
.logo{font-family:'Syne',sans-serif;font-size:34px;font-weight:800;color:var(--accent);letter-spacing:-1px;line-height:1}
.logo-sub{font-size:12px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-top:4px;margin-bottom:36px}
.heading{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;color:var(--text);margin-bottom:24px}
.form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.form-label{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}
.form-input{
  background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);
  padding:12px 14px;font-size:14px;color:var(--text);font-family:'DM Sans',sans-serif;
  transition:border-color .15s,background .15s;width:100%;
}
.form-input:focus{outline:none;border-color:var(--accent);background:#1c1600}
.form-input::placeholder{color:var(--muted2)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:13px 20px;border-radius:var(--radius);font-size:14px;font-weight:500;
  cursor:pointer;border:none;font-family:'DM Sans',sans-serif;transition:all .15s;width:100%;
}
.btn-primary{background:var(--accent);color:#000;font-weight:600}
.btn-primary:hover{background:var(--accent2);transform:translateY(-1px)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.alert{
  padding:11px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;
  display:none;line-height:1.4;
}
.alert-error{background:#2a1010;border:1px solid #e8505044;color:#f08080}
.alert-success{background:#0f2a1e;border:1px solid #3a9e6a44;color:#7adaa0}
.footer-link{text-align:center;margin-top:28px;font-size:13px;color:var(--muted)}
.footer-link a{color:var(--accent);text-decoration:none;font-weight:500}
.footer-link a:hover{text-decoration:underline}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--muted2);font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
</style>
</head>
<body>

<div class="card">
  <div class="logo">BINNA</div>
  <div class="logo-sub">Construction Project Management</div>

  <div class="heading">Sign in to your workspace</div>

  <div class="alert alert-error"   id="alert-error"></div>
  <div class="alert alert-success" id="alert-success"></div>

  <form id="login-form" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label class="form-label">Email or Username</label>
      <input class="form-input" type="text" id="login-id"
             placeholder="you@company.com" required autocomplete="username" />
    </div>
    <div class="form-group" style="margin-bottom:22px">
      <label class="form-label">Password</label>
      <input class="form-input" type="password" id="password"
             placeholder="••••••••" required autocomplete="current-password" />
    </div>
    <button class="btn btn-primary" type="submit" id="btn-submit">
      Sign In &rarr;
    </button>
  </form>

  <div class="footer-link">
    New to BINNA? <a href="/register">Create an account</a>
  </div>
</div>

<script>
// Redirect if already logged in
if (localStorage.getItem('binna_token')) window.location.href = '/dashboard';

async function handleLogin(e) {
  e.preventDefault();
  const loginId  = document.getElementById('login-id').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('btn-submit');

  clearAlerts();
  btn.disabled    = true;
  btn.textContent = 'Signing in…';

  try {
    const res = await fetch('/api/v1/auth/login', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ email: loginId, password }),
    });
    const data = await res.json();

    if (!res.ok) { showError(data.error || 'Login failed — check your credentials.'); return; }

    localStorage.setItem('binna_token', data.access_token);
    localStorage.setItem('binna_user',  JSON.stringify(data.user));

    showSuccess('✓ Signed in! Redirecting…');

    const next = new URLSearchParams(window.location.search).get('next') || '/dashboard';
    setTimeout(() => window.location.href = next, 700);

  } catch (err) {
    showError('Network error — is the BINNA server running?');
  } finally {
    btn.disabled    = false;
    btn.textContent = 'Sign In →';
  }
}

function showError(msg)   { const e = document.getElementById('alert-error');   e.textContent = msg; e.style.display = 'block'; }
function showSuccess(msg) { const e = document.getElementById('alert-success'); e.textContent = msg; e.style.display = 'block'; }
function clearAlerts()    { document.getElementById('alert-error').style.display = 'none'; document.getElementById('alert-success').style.display = 'none'; }
</script>
</body>
</html>
